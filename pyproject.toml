[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-converter"
version = "0.1.0"
description = "CLI tool and Python library for MOV to MP4 and HEIC to PNG conversions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pillow>=11.1.0,<12.0",
    "pillow-heif>=0.18.0",
    "imageio-ffmpeg>=0.5.0",
]

[project.scripts]
media-convert = "media_converter.cli:main"
